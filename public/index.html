<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geopolitics</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- One view shows at a time; app.js picks it. Each view has its own header slot. -->

  <!-- DESIGN §3.2 Home. app.js fills GameList and StartScreen for a logged-in player. -->
  <div class="view" data-view="home">
    <header class="slot slot--header" data-slot="header"></header>
    <main class="page">
      <section class="intro" data-slot="intro">
        <h2 class="intro__title">Conquer the world, one roll at a time</h2>
        <p class="intro__text">Pick a real country. Nine rivals join, each run by its own strategist. Take all ten to win.</p>
        <div class="intro__actions">
          <button type="button" class="button" data-action="login">Log in</button>
          <button type="button" class="button button--primary" data-action="signup">Sign up</button>
        </div>
      </section>
      <section data-slot="games" hidden></section>
      <section data-slot="start" hidden></section>
    </main>
  </div>

  <!-- DESIGN §3.1 Log in / Sign up: one centred column, max --form-max. -->
  <div class="view" data-view="auth" hidden>
    <header class="slot slot--header" data-slot="header"></header>
    <main class="page page--narrow" data-slot="auth-form"></main>
  </div>

  <!-- DESIGN §3.3 Game screen, layout from §4. gamePage.js fills every slot. -->
  <div class="view layout" data-view="game" hidden>
    <div class="layout__main">
      <header class="slot slot--header" data-slot="header"></header>
      <section class="slot slot--spectator" data-slot="spectator-banner" hidden></section>
      <section class="slot slot--turn-order" data-slot="turn-order" aria-label="Turn order"></section>
      <main class="slot slot--board" data-slot="board" aria-label="Nations"></main>
      <section class="slot slot--action" data-slot="action-bar" aria-label="Actions" hidden></section>
    </div>

    <div class="layout__side">
      <section class="slot slot--dice" data-slot="dice" aria-label="Dice"></section>
      <section class="slot slot--feed" data-slot="feed" aria-label="What happened"></section>
    </div>
  </div>

  <div class="toast-region" data-slot="toasts" aria-live="polite"></div>
</body>
</html>
